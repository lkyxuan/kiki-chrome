name: release
# Runs by itself when a merge to main changes the version in manifest.json (or push a tag like
# v0.1.2, or press "Run workflow"): packs the extension, publishes it on Releases, and, when the
# CWS_* secrets are set, uploads it to the Chrome Web Store and submits it for review.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match manifest.json and package.json
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            tag=$(node -p "require('./manifest.json').version")
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v$tag" >> "$GITHUB_OUTPUT"
          m=$(node -p "require('./manifest.json').version")
          p=$(node -p "require('./package.json').version")
          if [ "$tag" != "$m" ] || [ "$tag" != "$p" ]; then
            echo "tag v$tag, manifest.json $m, package.json $p: bump both before tagging" >&2
            exit 1
          fi
      - name: Skip if this version is already released
        id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then echo "done=1" >> "$GITHUB_OUTPUT"; echo "already released"; fi
      - if: steps.seen.outputs.done != '1'
        run: npm test
      - name: Pack
        if: steps.seen.outputs.done != '1'
        id: pack
        run: echo "zip=$(scripts/pack.sh)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: steps.seen.outputs.done != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          gh release create "$tag" "${{ steps.pack.outputs.zip }}" \
            --target "$GITHUB_SHA" \
            --title "kiki-chrome $tag" \
            --generate-notes \
            --notes "下载 kiki-chrome-${tag#v}.zip，解压后在每个 Chrome Profile 的 chrome://extensions 里「加载已解压的扩展程序」选这个文件夹；升级就解压到原来的文件夹覆盖，再点刷新。"
      # Chrome Web Store: upload the same zip to the existing item and submit it for review (listing,
      # screenshots and privacy answers stay as they are). Needs repo secrets CWS_CLIENT_ID,
      # CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN (see README "Chrome Web Store"); skipped without them.
      - name: Submit to Chrome Web Store
        if: steps.seen.outputs.done != '1' && env.CWS_REFRESH_TOKEN != ''
        env:
          CWS_ITEM: ljmhepikeflncdaolonniphfcihpcgic
        run: |
          set -euo pipefail
          token=$(curl -sf https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CWS_CLIENT_ID" --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token')
          up=$(curl -s -X PUT -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            -T "${{ steps.pack.outputs.zip }}" "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_ITEM")
          echo "upload: $up"
          echo "$up" | grep -q '"uploadState": *"SUCCESS"' || { echo "upload failed" >&2; exit 1; }
          pub=$(curl -s -X POST -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_ITEM/publish")
          echo "publish: $pub"
          echo "$pub" | grep -Eq '"(OK|ITEM_PENDING_REVIEW)"' || { echo "submit failed" >&2; exit 1; }
