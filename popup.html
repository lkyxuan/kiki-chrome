<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiki</title>
<style>
  :root { --bg:#fff; --fg:#131419; --muted:#6b6d76; --line:#e4e4e8; --accent:#fd890c; --field:#f6f6f8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131419; --fg:#f2f2f3; --muted:#8d8f98; --line:#2a2b33; --field:#1c1d24; } }
  * { box-sizing: border-box; }
  body { margin:0; width:300px; padding:16px; background:var(--bg); color:var(--fg); font:13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  h1 { margin:0 0 2px; font-size:15px; font-weight:650; display:flex; align-items:center; gap:8px; }
  h1 i { width:10px; height:10px; transform:rotate(45deg); background:var(--accent); border-radius:2px; display:inline-block; }
  .status { color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .dot.connected { background:#2fb36b; } .dot.error { background:#d93025; } .dot.connecting { background:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--field); color:var(--fg); font:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  .hint { font-size:11px; color:var(--muted); margin-top:4px; }
  button { margin-top:14px; width:100%; padding:9px; border:0; border-radius:8px; background:var(--accent); color:#131419; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.75; cursor:default; }
  .err { color:#d93025; }
  @media (prefers-color-scheme: dark) { .err { color:#ff6b5e; } }
  details { margin-top:12px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <h1><i></i>Kiki</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status"></span></div>

  <label for="name" data-i18n="lblName"></label>
  <input id="name" data-i18n-placeholder="phName" maxlength="40">
  <div class="hint" data-i18n="hintName"></div>
  <div class="hint" data-i18n="hintAuto"></div>

  <details id="adv">
    <summary data-i18n="advanced"></summary>
    <label for="server" data-i18n="lblServer"></label>
    <input id="server" placeholder="ws://127.0.0.1:4567/ext">
    <div class="hint" data-i18n="hintServer"></div>
    <label for="token" data-i18n="lblToken"></label>
    <input id="token" data-i18n-placeholder="phToken" autocomplete="off">
    <div class="hint" data-i18n="hintToken"></div>
  </details>

  <button id="save" data-i18n="btnConnect"></button>
  <script src="src/popup.js" type="module"></script>
</body>
</html>
